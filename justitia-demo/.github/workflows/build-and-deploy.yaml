name: Justitia 4.0 CI/CD

on:
  push:
    branches: [ main ] 
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/build-and-deploy.yaml'

jobs:
  build-and-push:   
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code abholen
        uses: actions/checkout@v3

      - name: Docker Werkzeuge bereitstellen
        uses: docker/setup-buildx-action@v2

      - name: Im Lager (GitHub Registry) anmelden
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container backen und verschicken
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ustitia-dashboard:latest
